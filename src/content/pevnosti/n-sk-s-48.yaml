# doplneno z monografie Delostrelecke tvrze (Suchanek 2024)
alt_name: "N-S 48 „U stodol\""
castTvrze: "Tvrz Skutina"
tech:
  odolnost: IV
  stupenDokonceni: dokonceny
history: |-
  Tvrzový pěchotní srub rozestavěné dělostřelecké tvrze **Skutina**. Dobový kód ŘOP: **N-S 48**; tvar „N-Sk-S 48" je novodobé rozlišení.

  Spolu s **N-S 49 „Pod lesem"** jeden ze **dvou vybetonovaných objektů** této tvrze. Stavba Skutiny byla zahájena až **18. listopadu 1937** firmou Dr. Ing. Karel Skorkovský — předposlední ze všech devíti zahájených tvrzí. Ze čtyř plánovaných objektů zůstal dělostřelecký srub **N-S 52 „Bažina"** ve stavu výkopu a minometný srub **N-S 51** nebyl vůbec zadán ke stavbě.

  Skutina spadala do úseku těžkého opevnění **Náchod (N-S)** a spolu se sousedním Dobrošovem měla tvořit dvojici tvrzí krytých vzájemnou dělostřeleckou palbou.

  Jako tvrzový objekt byl postaven ve **IV. stupni odolnosti**, bez klasického vchodu — vstupovalo se z podzemí výtahovou šachtou se schodištěm.
