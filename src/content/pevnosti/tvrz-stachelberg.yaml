# === HISTORIE ===
history: >
  Tvrz Stachelberg měla být jednou z velkých dělostřeleckých tvrzí
  československého opevnění budovaného v rámci Ředitelství opevňovacích prací
  (ŘOP) ve druhé polovině 30. let 20. století. Po Mnichovské dohodě
  30. září 1938 byla výstavba zastavena a větší část projektu zůstala
  nedokončena. Od 90. let 20. století je objekt postupně zpřístupňován
  veřejnosti. Muzeum provozuje občanské sdružení Stachelberg.

