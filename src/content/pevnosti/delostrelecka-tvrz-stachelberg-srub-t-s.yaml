description: >
  Záznam pěchotního srubu spadajícího pravděpodobně do areálu tvrze Stachelberg.
  Identifikace (kód objektu, krycí jméno) a vazba na zdroje vyžadují odbornou revizi
  proti literatuře (Stehlík, Ráboň). Wikipedia/Wikidata odkazy byly z tohoto záznamu
  dočasně odstraněny kvůli rozporu (T-S × T-St-S).
