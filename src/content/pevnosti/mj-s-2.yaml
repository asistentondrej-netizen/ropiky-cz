# doplneno z monografie Pechotni sruby (Suchanek-Fuksa 2025)
alt_name: Úvoz
history: >-
  Dochoval se pohled do interiéru horního patra nedokončeného objektu — otevřený prostor, který
  měl být později rozdělen cihlovými příčkami. Na některých zdech je již patrné oplechování; právě
  tam měly být místnosti telefonisty a velitele.
sources:
  - title: "Čs. opevnění 1935–1938: Pěchotní sruby"
    author: "Suchánek, Jiří – Fuksa, Ivan"
    year: 2025
    type: kniha
  - title: "Fond Ředitelství opevňovacích prací, karton 679 (matrice typů oboustranných objektů)"
    author: "VÚA–VHA Praha"
    type: archiv
historieMilniky:
  - datum: '1938'
    udalost: >-
      V seznamu matric typů isolovaných těžkých oboustranných objektů je u typové značky
      G 1501 (úhel sevření křídel 151° 06′) tužkou dopsáno označení tohoto objektu — typový
      výkres tedy vznikl přímo pro něj.
    zdroj: VÚA–VHA Praha, f. ŘOP, karton 679, Seznam matric typů isolovaných těžkých oboustranných objektů
