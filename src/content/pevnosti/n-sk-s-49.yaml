history: |-
  Tvrzový pěchotní srub rozestavěné dělostřelecké tvrze **Skutina**. Dobový kód ŘOP: **N-S 49**.

  Spolu s **N-S 48 „U stodol"** jeden ze **dvou vybetonovaných objektů** této tvrze.

  Skutina má v dějinách čs. pevnostního dělostřelectva jednu zvláštnost. Střílny pro 10cm houfnice vz. 38 vyrobené pro první tvrze umožňovaly **odměr pouhých 45°**; u tvrzí projektovaných v roce 1938 (Jírová hora, Poustka) se počítalo s novými střílnami s **odměrem 60°**. Pro Skutinu chtělo ŘOP původně použít starší, menší odměr, ale **v létě 1938, doslova na poslední chvíli před zahájením betonáže**, rozhodlo změnit střílny na výhodnějších 60°. K osazení už nedošlo — dělostřelecký srub N-S 52 „Bažina" se nestihl vybetonovat.

  Postaven ve **IV. stupni odolnosti**, bez klasického vchodu — vstupovalo se z podzemí výtahovou šachtou se schodištěm.
