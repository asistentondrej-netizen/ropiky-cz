# doplneno z monografie Pechotni sruby (Suchanek-Fuksa 2025)
alt_name: U křížku
history: >-
  Mohutný oboustranný dvoukřídlý objekt se třemi zvony ve II. stupni odolnosti, přímý soused tvrze
  Adam. Na pravé straně jsou dobře patrné střílny pro dvojkulomet vz. 37, 4cm kanon vz. 36 a
  kulomet vz. 26. Osádka na objekt namalovala heslo „Hraničáři nikdy nesklamou“. Nad schodištěm se
  dochovala nádrž na vodu o objemu 1 000 l. Objekt prochází rekonstrukcí.
sources:
