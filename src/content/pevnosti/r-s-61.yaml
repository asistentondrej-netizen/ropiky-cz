# doplneno z monografie Pechotni sruby (Suchanek-Fuksa 2025)
alt_name: Na kopečku
history: >-
  Na zdejší službu vzpomínal četař Ladislav Hess: v jednom ze skladišť byla uložena záložní dávka
  potravin pro případ obklíčení i erární rum, který osádka postupně vypila. Popsal také
  mobilizační postup — v objektu byla umístěna zvláštní skříňka s rozkazy, kterou velitel po
  vyhlášení pohotovosti rozbil; rozkazy nařizovaly za každou cenu zajistit obranu objektu až do
  příchodu velícího důstojníka, odstranit zbytky stavebních ohrad před střílnami a vyslat spojku k
  veliteli jednotky stráže obrany státu v předpolí.
sources:
  - title: "Čs. opevnění 1935–1938: Pěchotní sruby"
    author: "Suchánek, Jiří – Fuksa, Ivan"
