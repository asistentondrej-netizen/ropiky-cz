# doplneno z monografie Pechotni sruby (Suchanek-Fuksa 2025)
alt_name: Na stráni
history: >-
  Pravostranný pěchotní srub vybetonovaný v květnu 1938 společností Litická, a. s., Praha. Součást
  přehrazení Petříkovického údolí na Trutnovsku. Na dobových snímcích je patrný vchod do objektu,
  zvon pro těžký kulomet, mohutná kamenná rovnanina a zbytky staveniště.
sources:
