alt_name: U silnice
history: >-
  Při betonáži zde došlo k povolení šalování u ochranné střílny a beton unikl mimo požadovaný
  prostor. Jde o typický příklad stavební vady, jaké se během překotné výstavby občas objevovaly —
  v takových případech musela stavební firma závady opravit na vlastní náklady.
