# doplneno z monografie Pechotni sruby (Suchanek-Fuksa 2025)
alt_name: Zatáčka
history: >-
  Oboustranný dvoukřídlý objekt, který prošel poválečnou reaktivací. Její součástí byla aplikace
  kamuflážního nátěru (návrh maskování pochází z roku 1957), instalace 85mm protitankového kanonu
  vz. 44/59 s novými střílnami a vestavba plynotěsných plechových dveří ŽDV-6/I v centrální chodbě
  dolního patra. Srub sloužil k testování vybavení i k simulacím dlouhodobého pobytu osádek. Pod
  poválečnými nátěry se na stěnách dochovaly vlastenecké nápisy, které tam zanechala osádka v roce
  1938. V současné době je pevnost několikrát do roka otevírána pro veřejnost.
sources:
  - title: "Čs. opevnění 1935–1938: Pěchotní sruby"
    author: "Suchánek, Jiří – Fuksa, Ivan"
    year: 2025
    type: kniha
