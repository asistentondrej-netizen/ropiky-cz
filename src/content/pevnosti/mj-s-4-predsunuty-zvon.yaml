title: MJ-S 4 „Předsunutý zvon"
code: MJ-S 4
type: pechotni-srub
line: Jižní Morava (Slavonice)
region: Jihočeský kraj
location:
  lat: 48.9986
  lon: 15.3497
  elevation: 511
  address: Slavonice, u silnice na Stálkov
built: '1938'
state: pristupny
description: >-
  Jediný oboustranný pěchotní srub IV. stupně odolnosti na území bývalého Československa (stěny 3,5 m). Vzácná ukázka
  nejvyšší fortifikační kvality čs. opevnění. Obsahuje stopy německých zkušebních střeleb z doby okupace.
sources:
  - 'Stehlík E.: Lexikon těžkých objektů československého opevnění'
  - FortClub Praha
updated: '2026-04-18'
