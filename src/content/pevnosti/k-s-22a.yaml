# doplneno z monografie Delostrelecke tvrze (Suchanek 2024)
alt_name: K-S 22a
castTvrze: Tvrz Bouda
history: |-
  **Vchodový objekt** tvrze Bouda a nejlépe zrekonstruovaný objekt svého druhu v republice. Dobový kód ŘOP: **K-S 22a**.

  Napojení na podzemí zajišťuje **svážnice o sklonu 25 %** — šikmý výtah s klínovými podstavnými vozíky, na které vozík úzkorozchodné dráhy v horní stanici najel; v dolní stanici klínový vozík zajel 0,68 m pod úroveň podlahy, takže se náklad nemusel překládat.

  **Stav v září 1938** popsal svobodník Josef Glosse, který zde sloužil: *„Byly dohotoveny veškeré terénní úpravy kolem objektu, ale v podzemí tvrze se nadále pracovalo na elektrorozvodech, instalatérských pracích a dalších věcech. (…) Do našeho odchodu z tvrze se nepodařilo instalovat ani jedny z vrat do Portálu, ani první mřížová vrata. Vchod jsme měli provizorně uzavřený prkennými vraty. (…) V září ženisté na Portál přivezli a osadili dva pancéřové zvony. Podlážky do nich namontovány nebyly. (…) Nebyly ani periskopy do zvonů."*

  Objekt byl vážně poškozen a v letech 1949–1950 jej při přestavbě tvrze na muniční sklad **dobetonovala firma Baraba, Praha** (znárodněná společnost Ing. Zdenko Kruliš, která tvrz původně stavěla).

  **Rekonstrukce dokončená v roce 2021** zahrnula opravu a izolaci střechy, natažení omítek, osazení tvarově přesných replik zvonů, střílny těžkého kulometu, granátových skluzů, pancéřových dveří ve vchodu pro pěší a **posuvných vrat ve vjezdu**. Upraven byl i okolní terén, takže celek z velké části odpovídá stavu z roku 1938.
