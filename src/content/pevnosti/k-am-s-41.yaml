# doplneno z monografie Delostrelecke tvrze (Suchanek 2024)
alt_name: K-S 41 „Pod vrškem"
castTvrze: Tvrz Adam
history: |-
  Tvrzový pěchotní srub tvrze Adam, třetí ze tří vybetonovaných. Dobový kód ŘOP: **K-S 41**.

  Jako tvrzový objekt postaven ve **IV. stupni odolnosti**, bez klasického vchodu — vstupovalo se z podzemí výtahovou šachtou se schodištěm. Osádky Adamu ovšem v praxi do objektů chodily **nouzovými východy v ochranných příkopech**; jak vysvětlil poručík Pyšný: *„Bylo to z naprosto prozaického důvodu, vždyť komu by se chtělo stále trmácet ke vchodovému objektu, který byl situován poměrně daleko od zbytku tvrze."*
sources:
