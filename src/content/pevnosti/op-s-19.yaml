# doplneno z monografie Pechotni sruby (Suchanek-Fuksa 2025)
alt_name: U finanční budky
history: >-
  Na dobových snímcích z období okupace je u objektu patrný výkop pro telefonní kabel, který Němci
  vyzvedli a odvezli. Po skončení druhé světové války nesl srub stopy intenzivních bojů, které se
  v jeho okolí odehrály na jaře 1945.
