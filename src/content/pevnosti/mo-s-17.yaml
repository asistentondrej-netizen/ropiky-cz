# doplneno z monografie Pechotni sruby (Suchanek-Fuksa 2025)
alt_name: U Štípek
history: >-
  Na tomto objektu proběhly relativně rozsáhlé zkoušky kompletního zastírání — maskování pomocí
  sítí a porostu popínavých rostlin. Výsledky byly slibné, ŘOP však postup nakonec odmítlo kvůli
  vysokým nákladům a nutnosti sezonní obměny kamufláže. Levnější alternativu se do září 1938 najít
  nepodařilo.
