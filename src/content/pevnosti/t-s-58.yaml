alt_name: Velký les
history: >-
  Dobrý příklad jednokřídlého jednostranného pěchotního srubu arabské odolnosti. Tyto objekty se
  dělily na levokřídlé a pravokřídlé a stavěly se v místech s příkrým srázem nebo tam, kde by
  hrozilo zbytečné vystavení nepřátelské palbě.
