# doplneno z monografie Delostrelecke tvrze (Suchanek 2024)
alt_name: K-S 43 „Veverka"
castTvrze: Tvrz Adam
history: |-
  **Dělostřelecký srub** tvrze Adam — jeden ze šesti vybetonovaných v celém čs. opevnění a jeden ze dvou na Adamu (druhým je K-S 45 „Jabůrek"). Dobový kód ŘOP: **K-S 43**.

  Hlavní výzbroj měly tvořit **tři 10cm houfnice vz. 38**; nebyla vyrobena ani jedna z 87 objednaných. V roce 1938 zde byla podle původních dispozic zřízena **improvizovaná baterie tří 7,5cm horských kanonů vz. 15 přímo v ochranném příkopu** — což si vyžádalo částečné zasypání příkopu. Každý kanon kryl dřevěný přístřešek a maskovací síť, obsluhy se k dělům dostávaly přes dřevěné schůdky a střílnu tvrzové houfnice. Spolu s K-S 11 na Hůrce šlo o jediné dva objekty, kde se podařilo baterii umístit podle plánu.
sources:
