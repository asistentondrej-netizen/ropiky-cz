# doplneno z monografie Pechotni sruby (Suchanek-Fuksa 2025)
alt_name: Pravý
history: >-
  Jeden z dvojice nejmenších pěchotních srubů u Komářího vrchu v Orlických horách, postavených ve
  2. stupni odolnosti. Sousední R-S 90/II „Levý“ měl osádku pouhých 12 mužů a nese jediný
  dochovaný pancéřový prvek na našem opevnění se střílnou s depresí 1:2.
