# doplneno z monografie Pechotni sruby (Suchanek-Fuksa 2025)
alt_name: V lesíčku
history: >-
  Jeden z mála výrazně lomených pěchotních srubů. Projektanti se snažili lomení objektů držet pod
  210 cm, aby ušetřili prostředky za drahé kopule a protože velké výškové rozložení komplikovalo
  armování a snižovalo odolnost betonu; lomené objekty se proto vyskytovaly jen v omezeném
  množství, především na Králicku.
