# doplneno z monografie Pechotni sruby (Suchanek-Fuksa 2025)
alt_name: Modřín
history: >-
  Velitel objektu poručík pěchoty Antonín Maršík jej popsal takto: „Modřín byl oboustranný
  pěchotní srub, což znamenalo, že mohl vést palbu na obě strany — jak nalevo, tak napravo. Oběma
  směry z něj působila dvojčata těžkých kulometů. Zbraně to byly vynikající a jejich kvalitu ještě
  podtrhovala dokonalá lafetace a unikátní systém zaměřování.“
sources:
  - title: "Čs. opevnění 1935–1938: Pěchotní sruby"
    author: "Suchánek, Jiří – Fuksa, Ivan"
