# doplneno z monografie Pechotni sruby (Suchanek-Fuksa 2025)
alt_name: Bártovo pole
history: >-
  Jeden z pěti samostatných pěchotních srubů, do nichž ŘOP plánovalo osadit otočnou kulometnou věž
  OR. Dochoval se dobový snímek pořízený ze sousedního MO-S 33 „Kozmice“, který dobře dokumentuje
  podobu linie těžkého opevnění — vzájemné krytí objektů a postřelování prostoru před
  intervalovými překážkami.
sources:
  - title: "Čs. opevnění 1935–1938: Pěchotní sruby"
    author: "Suchánek, Jiří – Fuksa, Ivan"
    year: 2025
    type: kniha
