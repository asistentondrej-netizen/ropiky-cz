# doplneno z monografie Pechotni sruby (Suchanek-Fuksa 2025)
alt_name: Na hřebeni
history: >-
  Jeden ze tří objektů na Trutnovsku, na nichž po druhé světové válce probíhaly dokončovací
  stavební práce — spolu s T-S 81b „Vrchy“ a T-S 82 „V končinách“. Šlo o zlomek toho, co obnovené
  ŘOP původně plánovalo; od rozsáhlejších záměrů se ustoupilo kvůli nedostatku financí.
