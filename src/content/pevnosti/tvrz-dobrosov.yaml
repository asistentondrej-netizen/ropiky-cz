# === HISTORIE ===
history: >
  Tvrz Dobrošov u Náchoda byla budována v rámci Ředitelství opevňovacích prací
  (ŘOP) jako součást československého opevnění ve druhé polovině 30. let 20. století.
  V září 1938 byla výstavba v rozestavěném stavu — ne všechny plánované objekty
  byly dokončeny. Po Mnichovské dohodě 30. září 1938 byla výstavba zastavena.
  Od druhé poloviny 20. století je objekt postupně zpřístupňován veřejnosti.
  Dnes je jednou z navštěvovaných pevnostních památek a je spravován Muzeem Náchodska.

historieMilniky:
