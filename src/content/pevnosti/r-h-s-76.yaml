# doplneno z monografie Delostrelecke tvrze (Suchanek 2024)
alt_name: "R-S 76 „U lomu\""
castTvrze: "Tvrz Hanička"
tech:
  odolnost: IV
  stupenDokonceni: dokonceny
history: |-
  Tvrzový pěchotní srub dělostřelecké tvrze **Hanička**. Dobový kód ŘOP zněl **R-S 76**; tvar „R-H-S 76" je novodobé rozlišení tvrzových objektů rokytnického úseku. V literatuře se objekt uvádí jako „U lomu" i jako „Lom".

  **Vybetonován v září 1937**, osádku tvořilo **27 mužů**.

  Objekt nesl **tři hlavní pancéřové prvky**: kopuli pro dvojče těžkých kulometů, **dělostřelecký pozorovací zvon** a zvon pro pozorování a lehký kulomet. Za srubem se otevírá předpolí tvrze směrem k Vrchní Orlici a státní hranici.

  Jako tvrzový objekt byl postaven v nejvyšším, **IV. stupni odolnosti** — na rozdíl od izolovaných pěchotních srubů, jejichž odolnost dosahovala nejvýše III. stupně. Klasický vchod se zalomenou chodbičkou neměl; jediný běžně používaný vstup vedl **z podzemí tvrze výtahovou šachtou se schodištěm**.

  Velení tvrze nebylo s výhledem z pozorovacích zvonů na R-S 76 a R-S 77 plně spokojeno a koncem června 1938 získalo od ŘOP souhlas s vybudováním **předsunuté dělostřelecké pozorovatelny** — s podmínkou, že si ji osádka postaví sama z materiálu dostupného na staveništi.

  Pancéřové prvky byly z objektu později vytrhány — část během okupace, zbytek v polovině 50. let národním podnikem Kovošrot.
