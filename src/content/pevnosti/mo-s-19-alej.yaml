description: >
  Ukázkově rekonstruovaný oboustranný pěchotní srub v rámci skanzenu Darkovičky. Vybaven plnou dobovou výstrojí,
  replikami zbraní a pozorovacím zvonem. Spolu s MO-S 5 a MO-S 20 patří k nejkvalitněji zachovaným objektům těžkého
  opevnění v ČR.
