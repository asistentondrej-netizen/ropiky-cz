alt_name: Lázně
history: >-
  Příklad oboustranného jednokřídlého pěchotního srubu, u něhož si zvlněný horský terén vynutil
  umístit hlavní výzbroj na jedné straně do kopule nebo do zvonu s těžkým kulometem — lomení
  objektu by jinak bylo příliš velké.
