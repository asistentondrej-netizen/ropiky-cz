# === HISTORIE ===
history: >
  Tvrz Hůrka je jednou z dělostřeleckých tvrzí československého opevnění
  budovaného v rámci Ředitelství opevňovacích prací (ŘOP) ve druhé polovině
  30. let 20. století v oblasti Králicka. Po Mnichovské dohodě 30. září 1938
  byla odevzdána bez boje. Po roce 1945 ji využívala armáda. Po roce 2000
  byla postupně zpřístupňována veřejnosti a dnes je součástí Králického
  pevnostního areálu.

historieMilniky:
  - datum: 30. 9. 1938
    udalost: Mnichovská dohoda — opevnění odevzdáno bez boje

# === NÁVŠTĚVA ===
