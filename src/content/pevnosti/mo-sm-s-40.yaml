# doplneno z monografie Delostrelecke tvrze (Suchanek 2024)
alt_name: MO-S 40 „Nad silnicí"
castTvrze: Tvrz Smolkov
history: |-
  **Jediný tvrzový pěchotní srub tvrze Smolkov** — a jeden z mála objektů svého druhu, které měly zbraně **pouze pod pancířem**. Dobový kód ŘOP: **MO-S 40**.

  Smolkovská tvrz nebyla výjimečná jen tímto jediným pěchotním srubem; objekt navíc **nebyl začleněn do souvislé linie izolovaných pěchotních srubů**, protože tvrz jako celek leží zhruba kilometr za hlavní obrannou čárou.

  Úkoly srubu: ochrana západního svahu tvrze, postřelování silnice ze Smolkova do Hrabyně — a **stanoviště dělostřeleckého pozorovatele**, který ze svého zvonu s vynikajícím výhledem až k Malým Hošticím řídil palbu dělostřeleckého srubu MO-S 39. Osádku mělo tvořit **22 mužů**.

  Nad terén vystupovalo **šest pancéřových prvků**: nejníže dělostřelecký pozorovací zvon, nejvýše zvon pro pozorování a lehký kulomet, po stranách dvě kopule (každá pro jeden těžký kulomet) a dva malé ventilační zvony.

  Protože byl objekt zcela zapuštěn do terénu, **nouzový východ u něj zcela chyběl** — stejně jako u srubu K-S 23 na Boudě.
