# doplneno z monografie Pechotni sruby (Suchanek-Fuksa 2025)
alt_name: Nad řekou
history: >-
  Jeden ze dvou bezkřídlých pěchotních srubů arabské odolnosti postavených v Orlických horách u
  Zemské brány, kde svou palbou vykrývá příkré údolí Divoké Orlice. Hlavní zbraně jsou na obou
  stranách umístěny pod pancířem; jedinými střílnami pod betonem jsou pomocné. Osádku tvořilo
  pouhých 12 mužů.
sources:
