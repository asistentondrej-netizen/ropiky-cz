# doplneno z monografie Pechotni sruby (Suchanek-Fuksa 2025)
alt_name: Hranice
history: >-
  Dochoval se plán osvětlení dolního patra objektu s rozložením svítidel a kabeláže. V každé
  místnosti srubu bylo svítidlo, u každého pracovního stolu stolní lampa; pro nouzové osvětlení
  sloužily petrolejové lampy.
