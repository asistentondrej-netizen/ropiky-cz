# === HISTORIE ===
history: >
  Tvrz Smolkov je jednou z dělostřeleckých tvrzí československého opevnění
  budovaných v rámci Ředitelství opevňovacích prací (ŘOP) ve druhé polovině
  30. let 20. století. Po Mnichovské dohodě 30. září 1938 byla odevzdána bez boje.
  Po roce 1989 přešla postupně pod správu místních spolků a obce. Exteriéry
  srubů jsou dnes volně přístupné.

historieMilniky:
  - datum: 30. 9. 1938
    udalost: Mnichovská dohoda — opevnění odevzdáno bez boje

# === NÁVŠTĚVA ===
visit: >
  Tvrz Smolkov nabízí **volně přístupné exteriéry** bojových srubů — lze je
  obejít po turistické stezce. Podzemní prohlídky jsou pořádány pouze
  při speciálních akcích (Den otevřených bunkrů, historické rekonstrukce).

