history: >-
  Nedokončený objekt, v jehož horním patře nebyly dokončeny vnitřní práce, například cihlové
  příčky. V místech s viditelným oplechováním na stěnách mělo být stanoviště velitele a
  telefonisty — oplechování zvyšovalo ochranu proti úlomkům betonu při zásahu objektu.
