# doplneno z monografie Pechotni sruby (Suchanek-Fuksa 2025)
alt_name: Mezi lesíky
history: >-
  Oboustranný jednokřídlý pěchotní srub. Došlo u něj k nestandardnímu umístění zbraně O vedle
  vchodu — tou měl být postřelován týl tvrze Horka. V roce 1947 zde proběhly zkušební střelby,
  které měly prověřit odolnost objektu silně poškozeného během okupace a zároveň otestovat
  odolnost pancéřových zvonů proti tehdy moderním typům zbraní. K povinnostem zdejší osádky
  patřilo i uzavírání průjezdu zátarasů na silnici mezi tímto srubem a objektem „U boží muky“
  tvrze Berghöhe.
sources:
  - title: "Čs. opevnění 1935–1938: Pěchotní sruby"
    author: "Suchánek, Jiří – Fuksa, Ivan"
