# doplneno z monografie Delostrelecke tvrze (Suchanek 2024)
alt_name: "R-S 78 „Na pasece\""
castTvrze: "Tvrz Hanička"
tech:
  odolnost: IV
  stupenDokonceni: dokonceny
history: |-
  **Objekt pro otočnou a výsuvnou dělostřeleckou věž (RO)** tvrze Hanička. Dobový kód ŘOP: **R-S 78**.

  Jeden z **pěti vybetonovaných objektů svého druhu** v celém čs. opevnění (dále MO-S 38 „V lese", K-S 12 „Na kótě", K-S 22 a K-S 42 „Trigonometr"). Objekty pro věž se stavěly nedaleko nejvyšší kóty tvrze, aby se dal využít **360° palebný vějíř**. Protože byly tím pádem dobře pozorovatelné, zesílili konstruktéři **nad rámec IV. stupně odolnosti obvodové stěny na 3,5 m železobetonu** — nejvíc ze všech objektů čs. opevnění.

  Věž měla nést **dvojče 10cm houfnic vz. 38**, vážit zhruba **442,9 t** (pohyblivá část 125 t, protizávaží 125 t, pevné části ~192,9 t, sám předpancíř 160 t), odolat přímým zásahům granátů **do ráže 420 mm** a leteckých pum do 1 000 kg a vysunout se o **70 cm za sedm vteřin** elektromotorem (ručně asi 90 vteřin). Dotace munice měla činit **12 000 ran**, osádka **54 mužů**.

  **Do září 1938 nebyla dokončena ani jedna dělostřelecká věž.** Ve Škodovce byly rozpracované dva prototypy objednané v srpnu 1937. Některé ocelové součásti, které bylo třeba zabetonovat (odpadová roura pro nábojnice, kotevní železa), posílaly Škodovy závody na staveniště samostatně už v březnu a dubnu 1938.

  V rámci přísně tajného projektu **KAHAN** (od roku 1979) vznikl řez tímto objektem s červeně vyznačenými částmi, které měly být dostavěny a dobetonovány. Přestavba Haničky na válečné kryté pracoviště federálního ministerstva vnitra nebyla nikdy dokončena.
