# doplneno z monografie Pechotni sruby (Suchanek-Fuksa 2025)
alt_name: U kostela
history: >-
  Jediný samostatný pěchotní srub na Králicku, do něhož ŘOP plánovalo osadit otočnou kulometnou
  věž OR. Volba objektu pro věž vyžadovala možnost vedení kruhové palby a přehledné předpolí
  umožňující efektivní čelní střelbu. Do října 1938 nebyla dokončena ani jedna věž.
