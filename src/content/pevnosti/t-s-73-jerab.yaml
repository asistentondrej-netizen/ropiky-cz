history: |-
  **Jediný vybetonovaný objekt tvrze Stachelberg** (počátkem roku 1938 přejmenované Ředitelstvím opevňovacích prací na
  **Ježovou horu**), která byla projektována jako **největší dělostřelecká tvrz československého opevnění**.

  Stavba tvrze byla zahájena **16. října 1937** spojenými firmami Ing. Zdenko Kruliš a Konstruktiva a. s. Ze
  sestavy devíti plánovaných objektů — včetně **dvou dělostřeleckých otočných věží**, dvou dělostřeleckých srubů
  (T-S 77, T-S 78) a dvou minometných srubů (T-S 79, T-S 80) — se do září 1938 podařilo vybetonovat pouze tento srub.

  Jako tvrzový objekt byl postaven ve **IV. stupni odolnosti** a neměl klasický vchod; vstupovalo se z podzemí
  výtahovou šachtou se schodištěm. Sousední pěchotní srub T-S 74 „U silnice" zůstal ve stavu vybetonované základové
  skořápky.

  Ve výtahové a schodišťové šachtě probíhá **postupná rekonstrukce podle původních plánů**: namontovány už jsou
  repliky zábradlí mezi prvním a druhým patrem, dvojice nůžkových dveří, vodicí prvky pro výtah, protizávaží
  i motor s převodovkou. Oproti originálu jde o mírně modernější, ale velmi podobnou verzi. V šachtě měl fungovat
  výtah typu **Vý II o nosnosti 400 kg**.

  Zvenčí je dobře patrná dvojice střílen: vlevo pro kulomet vz. 26, vpravo pro **4cm kanon vz. 36 spřažený s těžkým
  kulometem vz. 37**. V objektu je dnes expozice přibližující jeho výzbroj v září 1938.

  Pěchotní galerie vedoucí k tomuto srubu je jedním z nejnázornějších míst v celém čs. opevnění — je na ní dobře
  vidět, že prostor mezi skalním masivem a vybetonovanou chodbou dělníci **vyskládali lomovými kameny**.

  Nezaměňovat s objektem **N-S 73 „Jeřáb"** tvrze Dobrošov, který má podobné označení.
