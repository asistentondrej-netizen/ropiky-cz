# doplneno z monografie Delostrelecke tvrze (Suchanek 2024)
alt_name: K-S 23
castTvrze: Tvrz Bouda
history: |-
  Tvrzový pěchotní srub tvrze Bouda. Dobový kód ŘOP: **K-S 23**.

  Patří do zvláštní kategorie objektů, které měly **hlavní i pomocnou výzbroj výhradně ve zvonech a kopulích** — takové sruby byly zcela zapuštěny do okolního terénu a **nouzový východ u nich zcela chyběl**. Druhým takovým objektem bylo MO-S 40 „Nad silnicí" na Smolkově.

  Přístup z podzemí zajišťovala **vyrovnávací šachta** (14 m, 74 schodů), jediná realizovaná ve stavebně dokončených tvrzích.

  V objektu měl mít bojové stanoviště dělostřelecký pozorovatel poručík **Jindřich Stach**. Protože pancéřový zvon nedorazil, strávil mobilizaci *„v improvizované dřevěné budce pokryté lepenkou. (…) Připadal jsem si tam chvílemi jako myslivec na posedu, protože ona boudička neměla čelní stěnu."*
sources:
