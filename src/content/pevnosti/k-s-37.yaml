# doplneno z monografie Pechotni sruby (Suchanek-Fuksa 2025)
alt_name: Na rozhledně
history: >-
  Objekt nesl dva pancéřové zvony (v pozadí pozorovací) a stál nedaleko tvrze Adam. Jeho osádka na
  stěnu namalovala heslo „Za vlast i životy dáme“. Mezi tímto srubem a K-S 38 „U křížku“ se dodnes
  dochoval protitankový příkop.
