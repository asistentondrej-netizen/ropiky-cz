# === HISTORIE ===
history: >
  Tvrz Adam je jednou z dělostřeleckých tvrzí československého opevnění
  budovaného v rámci Ředitelství opevňovacích prací (ŘOP) ve druhé polovině
  30. let 20. století v oblasti Králicka.
  Po podpisu Mnichovské dohody 30. září 1938 bylo opevnění odevzdáno bez boje.
  Po roce 1945 byla tvrz využívána armádou. V současnosti je veřejnosti
  zpravidla nepřístupná.

historieMilniky:
  - datum: 30. 9. 1938
    udalost: Mnichovská dohoda — opevnění odevzdáno bez boje

# === NÁVŠTĚVA ===
visit: >
  Tvrz Adam je standardně veřejnosti **nepřístupná**. Exteriér bojových srubů
  lze navštívit z veřejných turistických cest. Případné speciální akce
  sledujte na webech Králického pevnostního areálu.

