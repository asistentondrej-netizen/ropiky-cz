# doplneno z monografie Pechotni sruby (Suchanek-Fuksa 2025)
alt_name: Paletovo pole
history: >-
  Oboustranný dvoukřídlý objekt se zachovanými oběma pancéřovými zvony — vlevo pro těžký a vpravo
  pro lehký kulomet. Do října 1938 pancéřové prvky osazeny nebyly; dodatečně je sem Němci převezli
  z jiných opavských srubů při úpravě linie na ženijní cvičiště.
