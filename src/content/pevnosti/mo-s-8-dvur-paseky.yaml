historieMilniky:
  - datum: 17. 8. 1935
    udalost: >-
      MNO vypsalo utajenou soutěž na objekty 2 až 8 pohraničního úseku Moravská Ostrava
      (čj. 5703 Taj. – hl. št./ŘOP 1935). Uchazeč měl nahlédnout do plánů dvou z určených objektů
      a podáním nabídky se vzdával námitek, že před podáním nabídky neviděl podrobné plány
      jednotlivých objektů.
    zdroj: VÚA–VHA Praha, f. ŘOP, sign. 1935/8/1/12, s. 34–35
  - datum: srpen–září 1935
    udalost: >-
      Při vytyčování staveniště ŘOP uvedlo: „U objektu 8 se uvažuje přeložení cesty č. kat. 1802
      kolem vnější stěny překážek. Přístup do objektu by byl po této cestě od silnice č. kat.
      1309." Právě u objektů 2 a 8 se navíc muselo zjišťovat, zda k odříznutým zbytkům drobných
      parcel bude nutné zřizovat nové příjezdné cesty, nebo je bude možné sloučit s jinou
      parcelou téhož majitele.
    zdroj: VÚA–VHA Praha, f. ŘOP, sign. 1935/30/3/1, s. 34–35
  - datum: 5. 9. 1935
    udalost: >-
      ŽSV II hlásilo, že požádalo okresní úřady ve Fryštátě a v Hlučíně, aby vyzvaly majitele
      pozemků kolem objektů 2 až 8 k neobdělávání vyznačených ploch, a že zabíranou plochu
      vytyčuje zvláštními kolíky. Sondy u objektů byly zajištěny, zakryty a opatřeny výstražnými
      tabulkami; vrtané sondy u objektů 2 až 4 byly už dříve zaházeny.
    zdroj: VÚA–VHA Praha, f. ŘOP, sign. 1935/30/3/1, s. 44–45
  - datum: 19. 11. – prosinec 1935
    udalost: >-
      Koncept objednávky ŘOP čj. 677 hl. št. ŘOP 1935 na nosníky profilu 10 od Prodejny
      sdružených československých železáren (145,40 Kč za 100 kg, ve váze 36 q, do stanice
      Hrušov) uvádí: „Nosiče jsou určeny pro překlady v objektech S-5, S-6, S-7, S-8.“
    zdroj: VÚA–VHA Praha, f. ŘOP, sign. 1935/16/3/4-15, s. 18–19
  - datum: 17. 10. 1935
    udalost: >-
      MNO tajným dopisem čj. 5929/Taj. hl. št. ŘOP 1935 zadalo firmě Dr. K. Skorkovský a spol.
      (Praha-Vinohrady) práce spojené se stavbou objektů 2 až 8 úseku Moravská Ostrava za
      5 979 254,16 Kč, s vyloučením dodávky vnitřních železných dveří. Firma měla obdržet ústní
      direktivy pro přijímání a evidenci dělníků, aby bylo zajištěno utajení prací; ty tvořily
      součást zadávacích podmínek. Termín: ještě v roce 1935 zabetonovat alespoň jeden objekt,
      ostatní do konce června 1936, penále 500 Kč za každý den zdržení.
    zdroj: VÚA–VHA Praha, f. ŘOP, sign. 1935/62, s. 44
  - datum: 7. 11. 1935
    udalost: >-
      Velitelem podúseku objektů 2 až 8 byl ustanoven škpt. žen. Milota; pro stavební dozor
      a s ním spojenou administrativu mu byl přidělen kpt. stav. Procházka, dále prozatím
      por. stav. Tuka a smluvní úředník stavitel Illich. ŘOP výslovně nařídilo přidělit
      k vojenskému stavebnímu dozoru pro první dobu více personálu, než bylo nutné — kvůli
      zapracování lidí, kteří budou později nasazeni na dalších úsecích.
    zdroj: VÚA–VHA Praha, f. ŘOP, sign. 1935/62/2/8, s. 23
  - datum: prosinec 1935
    udalost: >-
      Na dotaz Ženijního skupinového velitelství II odpovědělo ŘOP, že přípravné práce na stavbě
      objektů 2 až 8 budou konány i v zimním období, pokud to počasí dovolí, a proto zůstane
      v Bohumíně jak ŽSV II, tak orgány pověřené dozorem na stavbě.
    zdroj: VÚA–VHA Praha, f. ŘOP, sign. 1935/62/2/28, s. 44
  - datum: 24. 12. 1935 – 16. 1. 1936
    udalost: >-
      Firma předložila první splátkový výkaz na 400 000 Kč. Platebním příkazem čj. 907 hl. št.
      ŘOP 1935 ex 1936 z 16. ledna 1936 bylo po srážce 12 000 Kč kolkovného poukázáno 88 000 Kč
      dobropisem na šekový účet č. 72.069-Praha a zbývajících 300 000 Kč vyplaceno ve formě
      dodavatelských poukázek podle zákona č. 67/1935 Sb. z. a n. — tří kusů po 100 000 Kč.
    zdroj: VÚA–VHA Praha, f. ŘOP, sign. 1935/62/2/38, s. 11
