# doplneno z monografie Pechotni sruby (Suchanek-Fuksa 2025)
alt_name: Odra
history: >-
  Dne 9. dubna 1936 došlo na zdejším staveništi k pokusu o krádež vzorků stavebních materiálů;
  strážní jednotka reagovala střelbou. Šlo o jeden z doložených případů německého zpravodajského
  zájmu o průběh výstavby těžkého opevnění.
sources:
  - title: "Čs. opevnění 1935–1938: Pěchotní sruby"
    author: "Suchánek, Jiří – Fuksa, Ivan"
    year: 2025
    type: kniha

