historieMilniky:
  - datum: 17. 8. 1935
    udalost: >-
      Objekt byl součástí utajené soutěže MNO na objekty 2 až 8 pohraničního úseku Moravská
      Ostrava (čj. 5703 Taj. – hl. št./ŘOP 1935).
    zdroj: VÚA–VHA Praha, f. ŘOP, sign. 1935/8/1/12, s. 34
  - datum: 2. 9. 1935
    udalost: >-
      Ženijní skupinové velitelství II předložilo situační náčrt „Situace S6“ v měřítku 1:2000
      (příloha k čj. 116/Taj. 1935) se středem objektu, směrem 170°00', spojnicemi k objektům S5
      a S7, tokem Odry, parcelami č. 1325, 1326, 1327, 1328, 1696 a 1697 a s body vytyčenými
      bílými kolíky. Pod plánem je poznámka „S6 posunut o 10 m po spojnici k S7“; při stanovení
      hranice staveniště se tedy počítalo s posunutím objektu asi o 10 metrů směrem k objektu 7.
    zdroj: VÚA–VHA Praha, f. ŘOP, sign. 1935/30/3/1, s. 35 a 41
  - datum: 23. 10. 1935
    udalost: >-
      ŽSV II hlásilo (čj. 176/Taj. 1935), že na břehu Odry nedaleko objektu S-6 nalezlo dosud
      neotevřené štěrkoviště s přirozenou směsí písku a štěrku z říčních nánosů. Laboratorní
      zkoušky prokázaly jílovitost 2,5 % (přípustné 3 %), slabou humusovitost, modul zrnitosti
      asi 5,94 a jen asi 2,5 promile měkkých součástí; vytřídit se mělo asi 19 % objemu.
      Přiloženou křivku zrnitosti proséváním na 13 sítech od 0,1 do 60 mm zpracoval čet. asp.
      Ing. Kočandrle.
    zdroj: VÚA–VHA Praha, f. ŘOP, sign. 1935/6/2/5, s. 1–3
  - datum: listopad 1935
    udalost: >-
      MNO souhlasilo, aby se pro beton v objektech 2 až 8 používal písek a štěrk ze štěrkoviště
      na parcele č. kat. 650/9 v sousedství objektu 6, s podmínkou dosypání nejjemnějšího zrna
      do 0,25 mm a úpravy štěrkoviště na náklad podnikatele tak, aby se nezhoršily palebné
      podmínky sousedních objektů. Podle zprávy ŽSV II obava nehrozila, protože „nejbližší objekt
      je nad štěrkovištěm převýšen" a štěrkoviště leželo za čárou opevnění.
    zdroj: VÚA–VHA Praha, f. ŘOP, sign. 1935/8/1/12, s. 49
  - datum: 14. 11. 1935
    udalost: >-
      Ředitelství velkostatku Dr. Alfonse Rothschilda v Šilheřovicích potvrdilo, že vojenská
      správa hodlá podle zákona č. 63/1935 Sb. získat části parcel č. kat. 1301, 1302, 1308,
      1322, 1325 a 1326 v katastrálním území Šilheřovice, a bylo ochotno je přenechat. Upozornilo
      však, že pozemky jsou odvodněny drenážemi, které nesmějí být poškozeny, vyhradilo si náhradu
      škod na neodstoupených pozemcích a požadovalo předkupní právo za obecnou hodnotu půdy
      v době zpětné koupě.
    zdroj: VÚA–VHA Praha, f. ŘOP, sign. 1935/30/3/1, s. 19–20
  - datum: 19. 11. – prosinec 1935
    udalost: >-
      ŘOP objednalo u Prodejny sdružených československých železáren nosníky profilu 10 za
      145,40 Kč za 100 kg. Koncept objednávky (čj. 677 hl. št. ŘOP 1935) uvádí: „Nosiče jsou
      určeny pro překlady v objektech S-5, S-6, S-7, S-8."
    zdroj: VÚA–VHA Praha, f. ŘOP, sign. 1935/16/3/4-15, s. 18–19
