title: Tvrz Orlík
code: K-S Tvrz Orlík
type: delostrelecka-tvrz
line: Králíky
region: "Pardubický kraj"
location:
  lat: 50.058
  lon: 16.637
  elevation: 747
  address: Mladkov — Petrovičky
state: rozpadly

description: >
  Rozestavěná dělostřelecká tvrz Orlík nad obcí Mladkov v Orlických horách.
  Součást plánovaného systému čs. opevnění 1935–1938 v úseku Králíky (K-S).
  Před Mnichovskou dohodou výstavba nedospěla do dokončení.

history: >
  Tvrz Orlík byla součástí plánu výstavby čs. opevnění 1935–1938 v úseku Králíky.
  Po Mnichovské dohodě 30. září 1938 byla výstavba přerušena a tvrz zůstala
  nedokončená. V terénu jsou patrné fragmenty stavebních prací.

visit: >
  V terénu jsou patrné zbytky stavebních prací — fragmenty jsou volně přístupné
  v lese, některé na soukromých pozemcích. Tvrz není muzejně vybavena.

