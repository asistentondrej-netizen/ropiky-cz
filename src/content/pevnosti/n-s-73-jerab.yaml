description: >-
  Zachovalý jednostranný pěchotní srub s výhledem na Náchod. Součást obranného pásma tvrze Dobrošov, dostupný z naučné
  stezky. Oblíbený cíl rodinných výletů díky kombinaci historie a výhledu.
