# doplneno z monografie Delostrelecke tvrze (Suchanek 2024)
alt_name: N-S 75 „Zelený"
castTvrze: Tvrz Dobrošov
history: |-
  **Dělostřelecký srub** rozestavěné tvrze Dobrošov — jeden ze šesti vybetonovaných v celém čs. opevnění. Dobový kód ŘOP: **N-S 75**.

  Z hlediska pevnostního dělostřelectva jde o **unikát**. Původní série střílen pro 10cm houfnice vz. 38, osazená na tvrzích Smolkov, Hůrka, Adam a Hanička, byla **tvarově nesouměrná** — obsahovala připravený výklenek pro jednokřídlová pancéřová dvířka, o jejichž použití ŘOP po francouzském vzoru uvažovalo, ale nakonec je nezavedlo. Po vyčerpání této série začaly Škodovy závody vyrábět **souměrné střílny bez výklenku** — a podařilo se je osadit **už jen zde**.

  Hlavní zbraň nikdy nedorazila: do září 1938 nebyla vyrobena ani jedna z 87 objednaných houfnic. V objektu jsou dnes k vidění **dvě makety pevnostních houfnic vz. 38**, vyrobené v roce 1972 pro film *Dny zrady* Otakara Vávry a původně instalované na Haničce; po jejím uzavření v roce 1975 putovaly sem. Protože skutečné houfnice byly v 50. letech sešrotovány a nedochovala se ani jedna, jsou tyto makety nejbližší dostupnou představou hlavní zbraně čs. tvrzí.

  Vedle stál rozestavěný dělostřelecký srub **N-S 76 „Amerika"**, u nějž se podařilo vyhloubit šachtu do podzemí, provést výkop objektu a vybetonovat základovou skořápku.

  Po Mnichovu zde Němci testovali podkaliberní protibetonové střely **Röchling**.
