history: |-
  Tvrzový pěchotní srub dělostřelecké tvrze **Hanička**. Dobový kód ŘOP: **R-S 80**.

  Jméno objektu je výstižné. **Při hloubení štoly pod tímto srubem narazili dělníci na tak vydatný pramen, že došlo k zaplavení celého pracovního prostoru** — a nepomohly ani nasazené pumpy. Situaci vyřešilo až proražení odvodňovací štoly.

  Voda přitom byla pro tvrz zásadní surovinou: už během ražby se podchycené prameny a průsaky sváděly do cisteren, odkud se čerpala jak pitná voda pro osádku, tak voda užitková pro stroje a protipožární systém. Množství se lišilo tvrz od tvrze — zatímco na Haničce byl problém opačný, na Adamu bylo vody tak málo, že se zásobní jímky musely doplňovat z autocisteren.

  Jako tvrzový objekt byl postaven ve **IV. stupni odolnosti**, bez klasického vchodu — vstupovalo se z podzemí výtahovou šachtou se schodištěm oddělenou v horním patře plynotěsnými dveřmi a přechodovou komorou.
