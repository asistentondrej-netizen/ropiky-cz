# doplneno z monografie Pechotni sruby (Suchanek-Fuksa 2025)
alt_name: Na trati
history: >-
  Objekt je konstrukční raritou: těleso železnice jej rozdělovalo na dvě vzájemně propojené části,
  které spojovala chodba vedoucí pod tratí. Vybetonován byl koncem července 1936 a patří ke
  skupině objektů z počátku výstavby, kdy sruby ještě do značné míry připomínaly některé pevnosti
  Maginotovy linie. Za okupace mu Němci vytrhli zvon pro těžký kulomet. Dnes v něm sídlí muzeum.
