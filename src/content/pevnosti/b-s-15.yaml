# doplneno z monografie Pechotni sruby (Suchanek-Fuksa 2025)
alt_name: Ostrov
history: >-
  Na objektu se dochovala jedna ze dvou posledních kopulí JA/D na samostatných pěchotních srubech
  — měla zajišťovat palebné krytí přes koryto Dunaje. Při poválečné reaktivaci komise rozhodla, že
  vzhledem k poloze objektu není instalace nového 85mm kanonu vz. 44/59 nezbytná.
