# === HISTORIE ===
history: >
  Tvrz Hanička je jednou z dělostřeleckých tvrzí československého opevnění
  budovaných v rámci Ředitelství opevňovacích prací (ŘOP) ve druhé polovině
  30. let 20. století. Po Mnichovské dohodě 30. září 1938 byla odevzdána bez boje.
  V druhé polovině 20. století byla část objektu využita státními orgány
  pro účely tehdejší doby. Od 90. let 20. století je objekt zpřístupňován
  veřejnosti jako muzeum.

historieMilniky:
  - datum: 30. 9. 1938
    udalost: Mnichovská dohoda — opevnění odevzdáno bez boje

# === NÁVŠTĚVA ===
visit: >
  Muzeum Tvrz Hanička je otevřeno sezónně, prohlídky probíhají s průvodcem.
  Aktuální otevírací doba a rezervace na hanicka.cz.

