# doplneno z monografie Pechotni sruby (Suchanek-Fuksa 2025)
alt_name: U nádraží
history: >-
  Příklad oboustranného jednokřídlého pěchotního srubu: kvůli konfiguraci terénu museli
  projektanti umístit zbraň M do kopule a zbraň L1 pod beton. V říjnu 1940 na něm němečtí
  odborníci ověřovali funkčnost lafety pro kulomet a její umístění v pancéřové kopuli.
