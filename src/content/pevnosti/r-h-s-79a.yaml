# doplneno z monografie Delostrelecke tvrze (Suchanek 2024)
alt_name: "R-S 79a „U silnice\""
castTvrze: "Tvrz Hanička"
tech:
  odolnost: IV
  stupenDokonceni: dokonceny
history: |-
  **Vchodový objekt** tvrze Hanička. Dobový kód ŘOP: **R-S 79a**.

  Jeden z **pěti vchodových objektů vybetonovaných do září 1938** (dále MO-S 41 „Nad Valchou", K-S 12a „U rybníčku", K-S 22a a K-S 43a „Na sekyře").

  Vchodové objekty neměly plnit bojové úkoly — měly zajistit **nerušené zásobování i ve chvíli, kdy na hlavní linii probíhaly střety**. Stavěly se proto na týlové straně kopce ve vzdálenosti 400–1 200 m od čelních pěchotních srubů. Spotřebou železobetonu šlo po dělostřeleckém srubu o **druhý nejmohutnější typ tvrzového objektu**.

  Vjezd pro nákladní automobily měla uzavírat trojice uzávěrů: **mřížová vrata** (křídlo asi 240 kg), **šestitunová vertikálně výsuvná pancéřová vrata** zavírající se po uvolnění protizávaží za **15 vteřin** a za zalomením chodby (ideálně pod úhlem 135°) **čtyřtunová posuvná vrata**. Prostor mezi oběma pancéřovými vraty sloužil jako velká přechodová komora, v níž se dala odmořit vozidla zasažená bojovými chemickými látkami.

  Napojení na podzemí zajišťovala **výtahová šachta se dvěma nákladními výtahy** — řešení použité jen u tří tvrzí (Hanička, Orel, Šibenice) v rovinatém terénu. Bylo nejméně výhodné jak z hlediska výstavby, tak plynulosti zásobování, a projektanti k němu přistupovali jen výjimečně.

  Na snímcích z přelomu let 1938 a 1939 je vjezd pro automobily **provizorně zakrytý prkny** — pancéřová vrata do žádného čs. vchodového objektu nikdy nedorazila.

  Dnes objekt slouží jako vstup do muzejní expozice tvrze.
