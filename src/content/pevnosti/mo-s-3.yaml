# doplneno z archivu VUA-VHA, fond ROP (karton 1-2)
history: >-
  Objekt byl součástí utajené soutěže MNO na objekty 2 až 8 pohraničního úseku Moravská Ostrava,
  vypsané 17. srpna 1935 pod čj. 5703 Taj. – hl. št./ŘOP 1935. Práce se zadávaly bez dodávky
  cementu a betonového železa a vojenská správa si vyhradila právo je podnikateli kdykoli odejmout,
  neplnil-li podmínky nebo nepostupoval podle jejích pokynů, a to bez nároku na odškodnění.
  Při vytyčování staveniště na podzim 1935 řešilo Ředitelství opevňovacích prací u tohoto objektu
  otázku přístupu: „U objektu 3 by bylo vyšetřiti, zda z taktických důvodů by nebyla výhodnější
  cesta k objektu od osady." Ženijní skupinové velitelství II v Novém Bohumíně pak ve zprávě
  z 23. září 1935 (čj. 134/Taj. 1935) navrhlo vést přístup po parcele č. kat. 487; zbytky parcel
  č. kat. 487/7, 487/8, 487/9 a 487/10, které měly po záboru zůstat nepřístupné, doporučilo
  vykoupit a prodat majiteli některé sousední parcely, protože příjezdná cesta k malým zbytkům
  by byla poměrně nákladná.
  Ke spisu je připojen situační náčrt objektu S3 pořízený ŽSV II, v němž jsou vyznačeny červené,
  bílé a modré kolíky vytyčující zabíranou plochu, výškové kóty a parcelní čísla.
