# doplneno z monografie Pechotni sruby (Suchanek-Fuksa 2025)
alt_name: Orel
history: >-
  Součást Areálu čs. opevnění Hlučín-Darkovičky spolu s MO-S 18 a MO-S 19. Mezi tímto objektem a
  MO-S 23 „Chlupáč“ byly do linie těžkého opevnění vloženy objekty lehkého opevnění nového typu
  („řopíky“), jejichž úkolem bylo střežit překážky za zhoršené viditelnosti a vykrývat hluchá
  místa v palebné linii.
sources:
  - title: "Čs. opevnění 1935–1938: Pěchotní sruby"
    author: "Suchánek, Jiří – Fuksa, Ivan"
    year: 2025
    type: kniha
