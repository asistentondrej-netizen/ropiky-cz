# doplneno z archivu VUA-VHA, fond ROP (karton 1-2)
history: >-
  Objekt patřil do první skupiny sedmi srubů ostravského úseku, na které ministerstvo národní
  obrany vypsalo 17. srpna 1935 utajenou soutěž (čj. 5703 Taj. – hl. št./ŘOP 1935, „Soutěž na
  objekty 2 až 8"). Uchazeči dostávali 24 druhů zadávacích pomůcek včetně ceníku o 68 stranách
  s doplňkem o 124 stranách a samostatných rozpočtů na objekty č. 2 až 8; podepsané pomůcky
  museli vrátit a neúspěšní zájemci vlastní opisy zničit a zničení potvrdit MNO pod trestním
  opatřením zákona na ochranu republiky č. 50/1923 Sb. Staveniště jednotlivých objektů ukazoval
  uchazečům důstojník Ženijního skupinového velitelství II v Bohumíně.
  Pozemky pro objekt se podle zásad ŘOP vykupovaly „až do vzdálenosti asi 2 metrů od vnější stěny
  překážek", pro přístupovou štěrkovanou cestu širokou 3 metry pak pruh asi 6 metrů i s příkopy;
  právě u objektů 2 a 8 dělaly potíže drobné odříznuté dílce parcel, u nichž se muselo zjišťovat,
  zda k nim bude nutné zřídit nové příjezdy.
  Ženijní skupinové velitelství II ve zprávě z 23. září 1935 (čj. 134/Taj. 1935) navrhlo ke
  zbytkům parcel č. kat. 183/1 a 184 zřídit příjezdnou cestu ze silnice č. kat. 559/1 a zabrat
  pro ni pruh o šířce 6,00 m — 2,50 m vozovka, dvakrát 0,75 m chodníky a dvakrát 1,00 m příkopy.
  Cesta měla sloužit i jako přístup k objektu: „leží sice v palebném vějíři, to však nevadí pro
  přísun a odsun v době míru." Druhý přístup byl možný po veřejné cestě č. kat. 547.
  Pozemky se získávaly podle zákona č. 63/1935 Sb.; v seznamu vyvlastňovacích spisů předložených
  MNO okresním úřadem v Hlučíně figurují u parcel 183/1 a 184 v katastrálním území Nový Bohumín
  majitelé Jakub a Mariana Kalischovi a Jan a Anna Lekiovi.
