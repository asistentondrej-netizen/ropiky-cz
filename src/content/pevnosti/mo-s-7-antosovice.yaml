# doplneno z monografie Pechotni sruby (Suchanek-Fuksa 2025)
alt_name: Antošovice
history: >-
  Na tomto objektu Ředitelství opevňovacích prací zkoušelo maskování zakrýváním srubu maskovacími
  sítěmi a porostem popínavých rostlin. Postup byl nakonec odmítnut kvůli vysokým nákladům a
  nutnosti pravidelné obměny kamufláže podle ročních období.
