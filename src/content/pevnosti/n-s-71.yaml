# doplneno z monografie Pechotni sruby (Suchanek-Fuksa 2025)
alt_name: V sedle
history: >-
  Objekt měl v rámci projektu Kahan III sloužit pro potřeby armádního spojení v případě válečného
  konfliktu mezi státy Varšavské smlouvy. Od druhé poloviny 80. let se na Náchodsku rozběhly práce
  naplno; komunikační stanice měla být schopna přečkat jaderný výbuch a být bezpečně napojena na
  tvrz Hanička. V roce 1991 byl projekt ukončen.
