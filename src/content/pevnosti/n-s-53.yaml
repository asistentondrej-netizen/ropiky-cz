alt_name: U chalupy
history: >-
  Objekt byl vybetonován mezi 26. zářím a 1. říjnem 1938 — patří tedy k úplně posledním betonážím
  československého těžkého opevnění. Krátce poté bylo staveniště opuštěno a díky tomu se dodnes
  zachovala řada unikátních prvků, například část šalování střílny pro zbraň N.
