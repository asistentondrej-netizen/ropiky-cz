<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" role="img" aria-label="Minometná kopule G/JA — schéma">
  <rect width="200" height="140" fill="#F1ECE0"/>
  <path d="M 0 62 L 200 62 L 200 140 L 0 140 Z" fill="#5C6B3A" opacity="0.35"/>
  <!-- strmé dráhy min do hluchého prostoru -->
  <g opacity="0.5" stroke="#7A3B2E" stroke-width="1" stroke-dasharray="4 3" fill="none">
    <path d="M 96 34 Q 60 -6 22 58"/>
    <path d="M 104 34 Q 146 -4 182 58"/>
  </g>
  <!-- objekt: tři patra -->
  <g transform="translate(52 62)">
    <rect x="0" y="0" width="96" height="60" fill="#8B7D62" stroke="#1A1612" stroke-width="1.5"/>
    <rect x="0" y="0" width="12" height="60" fill="#7A6E55"/>
    <rect x="84" y="0" width="12" height="60" fill="#7A6E55"/>
    <line x1="0" y1="24" x2="96" y2="24" stroke="#5A4E3A" stroke-width="0.9" opacity="0.6"/>
    <line x1="0" y1="44" x2="96" y2="44" stroke="#5A4E3A" stroke-width="0.9" opacity="0.6"/>
    <!-- žebřík mezi patry -->
    <g stroke="#5A4E3A" stroke-width="0.8" opacity="0.7">
      <line x1="70" y1="4" x2="70" y2="22"/>
      <line x1="76" y1="4" x2="76" y2="22"/>
      <line x1="70" y1="9" x2="76" y2="9"/><line x1="70" y1="14" x2="76" y2="14"/><line x1="70" y1="19" x2="76" y2="19"/>
    </g>
  </g>
  <!-- předpancíř 154,5 t, čtyři díly -->
  <path d="M 66 62 L 72 48 L 128 48 L 134 62 Z" fill="#4E4739" stroke="#1A1612" stroke-width="1.2"/>
  <g stroke="#1A1612" stroke-width="0.8" opacity="0.8">
    <line x1="82" y1="48" x2="78" y2="62"/>
    <line x1="100" y1="48" x2="100" y2="62"/>
    <line x1="118" y1="48" x2="122" y2="62"/>
  </g>
  <!-- pevná kopule s otočným vrchlíkem -->
  <path d="M 74 48 Q 100 20 126 48 Z" fill="#5E5646" stroke="#1A1612" stroke-width="1.5"/>
  <!-- přídavný pancíř 20 mm v horní třetině -->
  <path d="M 84 34 Q 100 20 116 34" fill="none" stroke="#F1ECE0" stroke-width="1.2" opacity="0.7"/>
  <!-- výstřelný otvor + dvojče 12cm minometů B-12, strmý náměr -->
  <g stroke="#1A1612" stroke-width="3.2" stroke-linecap="round">
    <line x1="96" y1="34" x2="90" y2="12"/>
    <line x1="104" y1="34" x2="110" y2="12"/>
  </g>
  <rect x="92" y="30" width="16" height="5" rx="1" fill="#1A1612"/>
  <!-- šachta do podzemí -->
  <g stroke="#7A3B2E" stroke-width="1" stroke-dasharray="2 3" fill="none" opacity="0.7">
    <line x1="100" y1="122" x2="100" y2="124"/>
    <path d="M 100 124 L 174 124"/>
  </g>
  <text x="100" y="134" text-anchor="middle" font-family="monospace" font-size="9" fill="#1A1612" opacity="0.6">2× 12cm minomet — strmá palba</text>
</svg>
