<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" role="img" aria-label="Vchodový objekt tvrze — schéma">
  <rect width="200" height="140" fill="#F1ECE0"/>
  <path d="M 0 108 L 200 108 L 200 140 L 0 140 Z" fill="#5C6B3A" opacity="0.35"/>
  <!-- příjezdová cesta -->
  <path d="M 0 104 L 200 100 L 200 108 L 0 112 Z" fill="#8B7D62" opacity="0.4"/>
  <g transform="translate(46 30)">
    <!-- tělo objektu -->
    <path d="M 0 24 L 12 6 L 96 6 L 108 24 L 108 78 L 0 78 Z" fill="#8B7D62" stroke="#1A1612" stroke-width="1.5"/>
    <path d="M 0 24 L 12 6 L 96 6 L 108 24 L 108 34 L 0 34 Z" fill="#7A6E55"/>
    <!-- pancéřová vrata -->
    <rect x="34" y="46" width="40" height="32" rx="2" fill="#5E5646" stroke="#1A1612" stroke-width="1.5"/>
    <line x1="54" y1="46" x2="54" y2="78" stroke="#1A1612" stroke-width="1"/>
    <g fill="#1A1612" opacity="0.8">
      <circle cx="46" cy="62" r="1.6"/>
      <circle cx="62" cy="62" r="1.6"/>
    </g>
    <!-- ochranné střílny po stranách vrat -->
    <rect x="10" y="52" width="16" height="7" rx="1" fill="#1A1612"/>
    <rect x="82" y="52" width="16" height="7" rx="1" fill="#1A1612"/>
    <!-- pěchotní zvon -->
    <ellipse cx="54" cy="6" rx="13" ry="4.5" fill="#5E5646" stroke="#1A1612" stroke-width="1"/>
    <rect x="51" y="0" width="6" height="7" rx="1" fill="#1A1612"/>
  </g>
  <!-- nákladní auto před vraty -->
  <g transform="translate(6 82)">
    <rect x="0" y="4" width="22" height="13" rx="1.5" fill="#5E5646" stroke="#1A1612" stroke-width="1"/>
    <path d="M 22 9 L 31 9 L 34 17 L 22 17 Z" fill="#7A6E55" stroke="#1A1612" stroke-width="1"/>
    <circle cx="7" cy="19" r="3.4" fill="#1A1612"/>
    <circle cx="28" cy="19" r="3.4" fill="#1A1612"/>
  </g>
  <!-- šachta a výtah do podzemí -->
  <g stroke="#7A3B2E" stroke-width="1" stroke-dasharray="2 3" fill="none" opacity="0.75">
    <line x1="100" y1="108" x2="100" y2="118"/>
    <path d="M 100 118 L 178 118"/>
    <rect x="92" y="110" width="16" height="9" rx="1.5"/>
  </g>
  <text x="100" y="134" text-anchor="middle" font-family="monospace" font-size="9" fill="#1A1612" opacity="0.6">brána do podzemí — zásobování tvrze</text>
</svg>
