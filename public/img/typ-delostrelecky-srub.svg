<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" role="img" aria-label="Dělostřelecký srub — schéma">
  <rect width="200" height="140" fill="#F1ECE0"/>
  <path d="M 0 115 L 200 115 L 200 140 L 0 140 Z" fill="#5C6B3A" opacity="0.35"/>
  <!-- zásyp kamennou rovnaninou vpravo (strana k nepříteli) -->
  <path d="M 150 105 L 168 38 L 200 30 L 200 105 Z" fill="#5C6B3A" opacity="0.45"/>
  <g transform="translate(14 34)">
    <!-- mohutné tělo, dvě patra -->
    <path d="M 0 26 L 12 8 L 140 8 L 152 26 L 152 71 L 0 71 Z" fill="#8B7D62" stroke="#1A1612" stroke-width="1.5"/>
    <!-- strop / horní pás -->
    <path d="M 0 26 L 12 8 L 140 8 L 152 26 L 152 34 L 0 34 Z" fill="#7A6E55"/>
    <!-- 20cm deska zarovnávající krakorce -->
    <rect x="4" y="24" width="120" height="5" fill="#5E5646" stroke="#1A1612" stroke-width="0.7"/>
    <!-- krakorce nad střílnami -->
    <g fill="#7A6E55" stroke="#1A1612" stroke-width="0.7">
      <path d="M 10 29 L 26 29 L 22 40 L 14 40 Z"/>
      <path d="M 48 29 L 64 29 L 60 40 L 52 40 Z"/>
      <path d="M 86 29 L 102 29 L 98 40 L 90 40 Z"/>
    </g>
    <!-- tři střílny houfnic -->
    <g fill="#1A1612">
      <rect x="12" y="43" width="18" height="9" rx="1"/>
      <rect x="50" y="43" width="18" height="9" rx="1"/>
      <rect x="88" y="43" width="18" height="9" rx="1"/>
    </g>
    <!-- hlavně -->
    <g stroke="#1A1612" stroke-width="3" stroke-linecap="round">
      <line x1="12" y1="47" x2="-6" y2="52"/>
      <line x1="50" y1="47" x2="32" y2="52"/>
      <line x1="88" y1="47" x2="70" y2="52"/>
    </g>
    <!-- pěchotní zvony -->
    <ellipse cx="60" cy="8" rx="11" ry="4" fill="#5E5646" stroke="#1A1612" stroke-width="1"/>
    <ellipse cx="112" cy="8" rx="11" ry="4" fill="#5E5646" stroke="#1A1612" stroke-width="1"/>
    <!-- dilatační spára -->
    <line x1="76" y1="8" x2="76" y2="71" stroke="#5A4E3A" stroke-width="0.8" opacity="0.6" stroke-dasharray="3 3"/>
  </g>
  <!-- ochranný příkop pod střílnami -->
  <path d="M 4 105 L 10 92 L 60 92 L 66 105 Z" fill="#F1ECE0" stroke="#1A1612" stroke-width="1" opacity="0.9"/>
  <!-- šachta do podzemí -->
  <g stroke="#7A3B2E" stroke-width="1" stroke-dasharray="2 3" fill="none" opacity="0.7">
    <line x1="150" y1="105" x2="150" y2="120"/>
    <path d="M 150 120 L 190 120"/>
  </g>
  <text x="100" y="134" text-anchor="middle" font-family="monospace" font-size="9" fill="#1A1612" opacity="0.6">3× 10cm houfnice — bočná palba</text>
</svg>
