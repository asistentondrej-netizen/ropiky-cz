<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" role="img" aria-label="Otočná kulometná věž OR — schéma">
  <rect width="200" height="140" fill="#F1ECE0"/>
  <path d="M 0 115 L 200 115 L 200 140 L 0 140 Z" fill="#5C6B3A" opacity="0.35"/>
  <!-- strop srubu -->
  <g transform="translate(40 74)">
    <rect x="0" y="0" width="120" height="41" fill="#8B7D62" stroke="#1A1612" stroke-width="1.5"/>
    <path d="M 0 0 L 120 0 L 120 10 L 0 10 Z" fill="#7A6E55"/>
    <rect x="50" y="12" width="20" height="29" fill="none" stroke="#1A1612" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.55"/>
  </g>
  <!-- předpancíř -->
  <path d="M 68 74 L 132 74 L 126 62 L 74 62 Z" fill="#4E4738" stroke="#1A1612" stroke-width="1.2"/>
  <!-- otočná část věže -->
  <rect x="78" y="40" width="44" height="23" rx="3" fill="#5E5646" stroke="#1A1612" stroke-width="1.5"/>
  <path d="M 78 44 Q 100 30 122 44 L 122 46 L 78 46 Z" fill="#5E5646" stroke="#1A1612" stroke-width="1.5"/>
  <path d="M 86 40 Q 100 32 114 40" fill="none" stroke="#8A7F65" stroke-width="1" opacity="0.55"/>
  <!-- dvě střílny pro TK -->
  <rect x="80" y="50" width="9" height="6" rx="1" fill="#1A1612"/>
  <rect x="111" y="50" width="9" height="6" rx="1" fill="#1A1612"/>
  <!-- šipky otáčení -->
  <g opacity="0.6" stroke="#7A3B2E" stroke-width="1.2" fill="none">
    <path d="M 66 44 A 36 22 0 0 1 100 26"/>
    <path d="M 134 44 A 36 22 0 0 0 100 26"/>
  </g>
  <polygon points="63,40 66,48 71,42" fill="#7A3B2E" opacity="0.7"/>
  <polygon points="137,40 134,48 129,42" fill="#7A3B2E" opacity="0.7"/>
  <!-- palba všemi směry -->
  <g opacity="0.5" stroke="#7A3B2E" stroke-width="1" stroke-dasharray="3 3">
    <line x1="78" y1="53" x2="40" y2="62"/>
    <line x1="122" y1="53" x2="160" y2="62"/>
  </g>
  <text x="100" y="132" text-anchor="middle" font-family="monospace" font-size="9" fill="#1A1612" opacity="0.6">OR — otočná kulometná věž (nerealizována)</text>
</svg>
